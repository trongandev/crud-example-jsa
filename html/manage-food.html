<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quản lí món ăn</title>
        <link rel="stylesheet" href="./font-awesome-6.5.1-pro-full/css/all.css" />
        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <!-- link swiper -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

        <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    </head>
    <body class="bg-amber-50">
        <!-- Header -->
        <header class="fixed top-0 z-50 w-full bg-orange-600 shadow-lg flex justify-between items-center h-16 px-10">
            <a href="../index.html" class="flex gap-2 items-center text-3xl font-bold text-white">
                <i class="fa-solid fa-utensils"></i>
                <p>Nhà Hàng <span class="text-yellow-300">MindX</span></p>
            </a>
            <nav class="flex gap-6 items-center text-white text-lg">
                <a href="../index.html" class="hover:text-yellow-300 transition"> <i class="fa-solid fa-home mr-2"></i>Trang chủ </a>
                <a href="./manage-food.html" class="hover:text-yellow-300 transition"> <i class="fa-solid fa-clipboard-list mr-2"></i>Quản lý món ăn </a>
            </nav>
        </header>
        <!-- Main -->
        <div class="py-20 max-w-7xl mx-auto min-h-screen">
            <h1 class="text-2xl font-medium mb-5">Quản lí món ăn</h1>
            <table id="manage-food">
                <tr>
                    <th class="border px-4 py-2">Tên món ăn</th>
                    <th class="border px-4 py-2">Mô tả</th>
                    <th class="border px-4 py-2">Hình ảnh</th>
                    <th class="border px-4 py-2">Hành động</th>
                </tr>
            </table>
        </div>
        <dialog id="my_modal_2" class="modal">
            <div class="modal-box">
                <h3 class="text-lg font-bold">Hello!</h3>
                <p class="py-4">Press ESC key or click outside to close</p>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
        <!-- Footer -->
        <footer class="bg-orange-900 text-white py-5 px-6">
            <div class="container mx-auto text-center">
                <p>&copy; 2024 Nhà Hàng MindX. All rights reserved.</p>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script src="../js/manage-food.js"></script>
    </body>
</html>
